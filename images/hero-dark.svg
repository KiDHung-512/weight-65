<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-labelledby="hero-dark-title">
  <title id="hero-dark-title">夜晚的月光下，一條蜿蜒的小路通往山丘頂端的終點旗子</title>
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14123f"/>
      <stop offset=".55" stop-color="#32276b"/>
      <stop offset="1" stop-color="#7a4a86"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff2b8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff2b8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="nframe"><rect width="480" height="380" rx="36"/></clipPath>
  </defs>

  <g clip-path="url(#nframe)">
    <rect width="480" height="380" fill="url(#nsky)"/>

    <!-- 星星 -->
    <g fill="#fff">
      <circle cx="180" cy="40" r="1.8" opacity=".9"/>
      <circle cx="230" cy="86" r="1.4" opacity=".7"/>
      <circle cx="300" cy="30" r="2" opacity=".95"/>
      <circle cx="350" cy="74" r="1.5" opacity=".7"/>
      <circle cx="420" cy="44" r="1.8" opacity=".9"/>
      <circle cx="452" cy="104" r="1.3" opacity=".6"/>
      <circle cx="160" cy="120" r="1.3" opacity=".6"/>
      <circle cx="40" cy="168" r="1.6" opacity=".7"/>
      <circle cx="262" cy="140" r="1.2" opacity=".6"/>
      <circle cx="398" cy="150" r="1.5" opacity=".7"/>
      <circle cx="120" cy="30" r="1.2" opacity=".6"/>
    </g>

    <!-- 月亮 -->
    <circle cx="96" cy="92" r="84" fill="url(#glow)"/>
    <circle cx="96" cy="92" r="46" fill="#fff2b8"/>
    <g fill="#f0dc96" opacity=".75">
      <circle cx="82" cy="80" r="9"/>
      <circle cx="112" cy="104" r="7"/>
      <circle cx="100" cy="72" r="4"/>
    </g>

    <!-- 雲 -->
    <g fill="#6a5ca8" opacity=".55">
      <ellipse cx="262" cy="70" rx="38" ry="12"/>
      <ellipse cx="288" cy="59" rx="26" ry="13"/>
      <ellipse cx="400" cy="116" rx="30" ry="10"/>
      <ellipse cx="420" cy="106" rx="20" ry="10"/>
    </g>

    <!-- 遠山 -->
    <path d="M0 250 Q 90 190 190 232 T 380 214 T 480 226 V380 H0 Z" fill="#2a4f7a"/>

    <!-- 近山 -->
    <path d="M0 330 C 100 300, 200 240, 290 170 C 340 130, 420 120, 480 160 V380 H0 Z" fill="#157a64"/>

    <!-- 小路（月光照亮） -->
    <path d="M100 384 C 150 352, 270 350, 262 306 C 256 272, 190 280, 232 246 C 270 216, 330 226, 346 182 C 354 160, 372 150, 381 138"
          fill="none" stroke="#ffeaa8" stroke-width="16" stroke-linecap="round" opacity=".92"/>
    <path d="M100 384 C 150 352, 270 350, 262 306 C 256 272, 190 280, 232 246 C 270 216, 330 226, 346 182 C 354 160, 372 150, 381 138"
          fill="none" stroke="#ff9a62" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>

    <!-- 小樹 -->
    <g>
      <rect x="52" y="304" width="5" height="22" rx="2" fill="#4a3326"/>
      <circle cx="54.5" cy="298" r="16" fill="#0d5a49"/>
      <rect x="92" y="326" width="4" height="18" rx="2" fill="#4a3326"/>
      <circle cx="94" cy="320" r="12" fill="#1c8a63"/>
      <rect x="436" y="190" width="4" height="18" rx="2" fill="#4a3326"/>
      <circle cx="438" cy="184" r="12" fill="#0d5a49"/>
    </g>

    <!-- 旗子 -->
    <rect x="379" y="70" width="4" height="68" rx="2" fill="#d9c8f0"/>
    <rect x="383" y="72" width="60" height="32" rx="7" fill="#d93a22"/>
    <text x="413" y="94" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="800" fill="#fff">GO!</text>
    <circle cx="381" cy="68" r="5" fill="#ffc533"/>

    <!-- 螢火蟲 -->
    <g fill="#ffe27a">
      <circle cx="170" cy="340" r="3"/><circle cx="170" cy="340" r="7" opacity=".25"/>
      <circle cx="326" cy="300" r="3"/><circle cx="326" cy="300" r="7" opacity=".25"/>
      <circle cx="408" cy="232" r="3"/><circle cx="408" cy="232" r="7" opacity=".25"/>
      <circle cx="36" cy="350" r="3"/><circle cx="36" cy="350" r="7" opacity=".25"/>
      <circle cx="226" cy="214" r="2.5"/><circle cx="226" cy="214" r="6" opacity=".25"/>
    </g>
  </g>
</svg>
